  <!DOCTYPE html>
  <html lang="en" class="spectrum spectrum--medium spectrum--light">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://unpkg.com/@spectrum-css/vars/dist/spectrum-global.css">
    <link rel="stylesheet" href="https://unpkg.com/@spectrum-css/typography">
    <link rel="stylesheet" href="index.css">
  <title>424GoldMagpie</title>
  <script src="./src/utils.js" type="module"></script>
  <script src="./src/index.js" type="module"></script>
</head>
<body>
  <h1>Welcome to 424GoldMagpie!</h1>
  <div class="spectrum--large spectrum-Typography spectrum-Site">

    <!-- AEM Assets Folder Browser -->
    <div id="aem-browser-section">
      <h2>AEM Assets Folder Browser</h2>

      <div class="browser-config">
        <div class="config-row">
          <label for="aem-host">AEM Host:</label>
          <input type="text" id="aem-host" placeholder="https://author-p12345-e67890.adobeaemcloud.com" />
        </div>
        <div class="config-row">
          <label for="aem-start-path">Folder Path:</label>
          <input type="text" id="aem-start-path" value="/content/dam" placeholder="/content/dam" />
        </div>
        <button id="browse-btn" type="button">Browse</button>
      </div>

      <div id="browser-status" class="browser-status"></div>

      <nav id="breadcrumb" class="breadcrumb" aria-label="Folder path"></nav>

      <div id="browser-content" class="browser-content" style="display:none">
        <div class="browser-panel">
          <h3>Folders <span id="folder-count" class="count-badge"></span></h3>
          <ul id="folder-list" class="folder-list"></ul>
        </div>

        <div class="browser-panel">
          <h3>Assets <span id="asset-count" class="count-badge"></span></h3>
          <table class="asset-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Format</th>
                <th>Size</th>
                <th>Last Modified</th>
              </tr>
            </thead>
            <tbody id="asset-list-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Existing Actions Invoker -->
    <div>
      <h2>Run your application backend actions</h2>
      <form id='actionForm'>
        <div>
          <label for='action-list'>Select an action.</label>
          <span id="action-list" name="action-list"></span>
        </div>
        <div>
          <label for="actionParams">headers { json } to pass to your action:</label>
          <textarea id='actionHeaders' name='actionHeaders' placeholder='{ "key": "value" }'></textarea>
        </div>
        <div>
          <label for="actionParams">params { json } to pass to your action:</label>
          <textarea id='actionParams' name='actionParams' placeholder='{ "key": "value" }'></textarea>
        </div>
        <input type="submit" value="Invoke">
      </form>
    </div>
    <div>
      <h2>results</h2>
      <textarea id='taOutput' readonly spellcheck="false" style="min-height:260px;"></textarea>
    </div>
    <footer>
      <h2>Useful documentation for your app</h2>
      <a href='https://github.com/AdobeDocs/project-firefly/blob/master/README.md#project-firefly-developer-guide' target='_blank'>
        Adobe Developer App Builder
      </a>
      <a href='https://github.com/adobe/aio-sdk#adobeaio-sdk' target='_blank'>
        Adobe I/O SDK
      </a>
      <a href='https://adobedocs.github.io/adobeio-runtime/' target='_blank'>
        Adobe I/O Runtime
      </a>
      <a href='https://react-spectrum.adobe.com/react-spectrum/index.html' target='_blank'>
        React Spectrum
      </a>
    </footer>
  </div>
</body>
</html>
