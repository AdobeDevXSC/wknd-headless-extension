name: Deploy App Builder to PROD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-builder-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate deployment configuration
        env:
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
          AIO_RUNTIME_NAMESPACE: ${{ vars.AIO_RUNTIME_NAMESPACE }}
          AIO_RUNTIME_APIHOST: ${{ vars.AIO_RUNTIME_APIHOST }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
        run: |
          node <<'NODE'
          const required = ['AIO_RUNTIME_AUTH', 'AIO_RUNTIME_NAMESPACE', 'AIO_RUNTIME_APIHOST', 'SERVICE_API_KEY'];
          const missing = required.filter((name) => !process.env[name]?.trim());
          for (const name of missing) {
            console.error(`::error::Missing ${name} in the PROD environment.`);
          }
          if (missing.length) process.exit(1);
          NODE
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix react-app
          npm ci --prefix next-js
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 11.1.2
      - name: Test
        run: |
          npm test -- --runInBand
          npm run test:wknd
      - name: Build and deploy actions and web assets
        env:
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
          AIO_RUNTIME_NAMESPACE: ${{ vars.AIO_RUNTIME_NAMESPACE }}
          AIO_RUNTIME_APIHOST: ${{ vars.AIO_RUNTIME_APIHOST }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          AEM_PUBLISH_HOST: ${{ vars.AEM_PUBLISH_HOST }}
          PROXY_ALLOWED_ORIGINS: ${{ vars.PROXY_ALLOWED_ORIGINS }}
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: aio app deploy --no-publish --no-log-forwarding-update
