name: Deploy App Builder to STAGE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-builder-stage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    environment: STAGE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate deployment configuration
        env:
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
          AIO_RUNTIME_NAMESPACE: ${{ vars.RUNTIME_NAMESPACE }}
          AIO_RUNTIME_APIHOST: ${{ vars.AIO_RUNTIME_APIHOST }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          CLIENTID: ${{ vars.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TECHNICALACCID: ${{ vars.TECHNICALACCID }}
          TECHNICALACCEMAIL: ${{ vars.TECHNICALACCEMAIL }}
          IMSORGID: ${{ vars.IMSORGID }}
          SCOPES: ${{ vars.SCOPES }}
        run: |
          node <<'NODE'
          const required = [
            'AIO_RUNTIME_AUTH', 'AIO_RUNTIME_NAMESPACE', 'AIO_RUNTIME_APIHOST',
            'CLIENTID', 'CLIENTSECRET', 'TECHNICALACCID', 'TECHNICALACCEMAIL', 'IMSORGID', 'SCOPES',
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          for (const name of missing) {
            const setting = name === 'AIO_RUNTIME_NAMESPACE' ? 'RUNTIME_NAMESPACE' : name;
            console.error(`::error::Missing ${setting} in the STAGE environment.`);
          }
          if (missing.length) process.exit(1);
          if (!process.env.SERVICE_API_KEY?.trim()) {
            console.warn('::warning::SERVICE_API_KEY is not configured. Calls to publish-events must supply apiKey.');
          }
          NODE
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix react-app
          npm ci --prefix next-js
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 11.1.2
      - name: Test
        run: |
          npm test -- --runInBand
          npm run test:wknd
      - name: Authenticate with Adobe IMS
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: oauth_sts
          CLIENTID: ${{ vars.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TECHNICALACCOUNTID: ${{ vars.TECHNICALACCID }}
          TECHNICALACCOUNTEMAIL: ${{ vars.TECHNICALACCEMAIL }}
          IMSORGID: ${{ vars.IMSORGID }}
          SCOPES: ${{ vars.SCOPES }}
      - name: Mask generated IMS token
        run: |
          if [ -z "$AIO_IMS_CONTEXTS_CLI_ACCESS__TOKEN_TOKEN" ]; then
            echo "::error::Adobe IMS authentication did not provide a deployment token."
            exit 1
          fi
          echo "::add-mask::$AIO_IMS_CONTEXTS_CLI_ACCESS__TOKEN_TOKEN"
      - name: Build and deploy actions and web assets
        env:
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
          AIO_RUNTIME_NAMESPACE: ${{ vars.RUNTIME_NAMESPACE }}
          AIO_RUNTIME_APIHOST: ${{ vars.AIO_RUNTIME_APIHOST }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          AEM_PUBLISH_HOST: ${{ vars.AEM_PUBLISH_HOST }}
          PROXY_ALLOWED_ORIGINS: ${{ vars.PROXY_ALLOWED_ORIGINS }}
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: aio app deploy --no-publish --no-log-forwarding-update
